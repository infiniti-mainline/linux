%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx709.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX709 Image Sensor

description:
  Sony IMX709 is a 32 megapixel (6560x4928) 10-bit RAW image sensor,
  controlled over I2C, with a 4-lane MIPI CSI-2 D-PHY output.

maintainers:
  - Victor Fuentes <victor@vlinkz.dev>

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: sony,imx709

  reg:
    maxItems: 1

  clocks:
    description: Input clock (INCK/XVCLK).
    maxItems: 1

  reset-gpios:
    description: Active low GPIO connected to the reset pad of the sensor.
    maxItems: 1

  dovdd-supply:
    description: Interface supply, 1.8 volts.

  avdd-supply:
    description: Analogue supply, 2.9 volts.

  dvdd-supply:
    description: Digital core supply.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "sony,imx709";
            reg = <0x10>;
            clocks = <&camera_mclk 0>;
            assigned-clocks = <&camera_mclk 0>;
            assigned-clock-rates = <19200000>;
            reset-gpios = <&gpio1 10 GPIO_ACTIVE_LOW>;
            dovdd-supply = <&vreg_1p8>;
            avdd-supply = <&vreg_2p8>;
            dvdd-supply = <&vreg_1p1>;

            port {
                endpoint {
                    link-frequencies = /bits/ 64 <375900000>;
                    data-lanes = <1 2 3 4>;
                    remote-endpoint = <&mipi_csi2_ep>;
                };
            };
        };
    };
...
